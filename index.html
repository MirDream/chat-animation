<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>聊天动画 · v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    background: #d9dde3;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .phone {
    width: 375px;
    height: 720px;
    background: #ededed;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
    display: flex;
    flex-direction: column;
  }
  .bar {
    height: 48px;
    background: #ededed;
    border-bottom: 1px solid #dcdcdc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    color: #191919;
  }
  .chat {
    flex: 1;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .row.me { justify-content: flex-end; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 6px;
    flex: 0 0 34px;
    background: #c8ccd4;
  }
  .row.me .avatar { background: #a8c7a0; }
  .bubble {
    max-width: 230px;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    color: #191919;
    background: #ffffff;
    word-break: break-word;
    animation: pop 0.22s ease;
  }
  .row.me .bubble { background: #95ec69; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
  }
  .typing {
    display: flex;
    gap: 4px;
    padding: 12px 14px;
  }
  .typing i {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #9aa0a6;
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: 0.2s; }
  .typing i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="bar">码道小助手</div>
    <div class="chat" id="chat"></div>
  </div>

<script>
  // 对话脚本：7 句，循环播放
  var SCRIPT = [
    { who: 'them', text: '在吗？' },
    { who: 'me',   text: '在的，怎么啦？' },
    { who: 'them', text: '我想用 AI 做一个无限动画，听说可以用 git 边做边回退？' },
    { who: 'me',   text: '对，思路很简单' },
    { who: 'them', text: '满意就 commit，不满意就 checkout / reset 回退再改' },
    { who: 'me',   text: '懂了，那我先去试试' },
    { who: 'them', text: '👍 有不懂的随时问' }
  ];

  var chat = document.getElementById('chat');

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function appendRow(msg) {
    var row = el('div', 'row' + (msg.who === 'me' ? ' me' : ''));
    var avatar = el('div', 'avatar');
    var bubble = el('div', 'bubble', msg.text);
    if (msg.who === 'me') {
      row.appendChild(bubble);
      row.appendChild(avatar);
    } else {
      row.appendChild(avatar);
      row.appendChild(bubble);
    }
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function appendTyping() {
    var row = el('div', 'row');
    row.appendChild(el('div', 'avatar'));
    row.appendChild(el('div', 'bubble typing', '<i></i><i></i><i></i>'));
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  async function play() {
    chat.innerHTML = '';
    await sleep(300);
    for (var i = 0; i < SCRIPT.length; i++) {
      var msg = SCRIPT[i];
      if (msg.who === 'them') {
        // 对方发消息前先显示「正在输入」
        var typing = appendTyping();
        await sleep(1100);
        typing.remove();
      } else {
        await sleep(600);
      }
      appendRow(msg);
      await sleep(760);
    }
    await sleep(2200);
    play();          // 整体循环播放
  }

  play();
</script>
</body>
</html>
