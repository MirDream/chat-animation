<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>聊天动画 · v3+ 特性分支</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, #e6eaf0, #cfd5dd);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .phone {
    width: 375px;
    height: 720px;
    background: #ededed;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 20px 54px rgba(20, 28, 40, 0.26);
    display: flex;
    flex-direction: column;
  }
  .bar {
    height: 48px;
    background: #ededed;
    border-bottom: 1px solid #dcdcdc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    color: #191919;
  }
  .chat {
    flex: 1;
    padding: 14px 12px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    scroll-behavior: smooth;
  }

  /* 时间分割线：灰底圆角小药丸 */
  .divider {
    align-self: center;
    background: rgba(0, 0, 0, 0.06);
    color: #8b8f96;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    margin: 2px 0 4px;
    letter-spacing: 0.02em;
  }

  .row { display: flex; gap: 8px; align-items: flex-start; }
  .row.me { justify-content: flex-end; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 6px;
    flex: 0 0 34px;
    background: linear-gradient(140deg, #cfd4dc, #b9bfc9);
  }
  .row.me .avatar { background: linear-gradient(140deg, #b7d8ad, #94bd88); }

  .bubble {
    position: relative;
    max-width: 230px;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.55;
    color: #1a1a1a;
    background: #ffffff;
    word-break: break-word;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08), 0 4px 10px rgba(16, 24, 40, 0.06);
    animation: pop 0.22s ease both;
  }

  /* 气泡朝向头像的小尾巴 */
  .bubble::before {
    content: '';
    position: absolute;
    top: 12px;
    width: 0; height: 0;
    border: 6px solid transparent;
  }
  .row:not(.me) .bubble::before {
    left: -11px;
    border-right-color: #ffffff;
    border-left-width: 0;
  }
  .row.me .bubble::before {
    right: -11px;
    border-left-color: #86e35c;
    border-right-width: 0;
  }
  .row.me .bubble {
    background: #86e35c;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(7px) scale(0.98); }
  }

  /* 对方正在输入：文字变绿 + 省略号动效 */
  .typing {
    display: inline-flex;
    align-items: baseline;
    gap: 2px;
    color: #3aa845;
    font-size: 13px;
  }
  .typing .dots span {
    animation: ellipsis 1.4s infinite;
  }
  .typing .dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes ellipsis {
    0%, 20% { opacity: 0; }
    50%, 100% { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="bar">码道小助手</div>
    <div class="chat" id="chat"></div>
  </div>

<script>
  // 对话脚本：7 句，循环播放
  var SCRIPT = [
    { who: 'them', text: '在吗？' },
    { who: 'me',   text: '在的，怎么啦？' },
    { who: 'them', text: '我想用 AI 做一个无限动画，听说可以用 git 边做边回退？' },
    { who: 'me',   text: '对，思路很简单' },
    { who: 'them', text: '满意就 commit，不满意就 checkout / reset 回退再改' },
    { who: 'me',   text: '懂了，那我先去试试' },
    { who: 'them', text: '👍 有不懂的随时问' }
  ];

  var chat = document.getElementById('chat');

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function clock() {
    var d = new Date();
    var h = String(d.getHours()).padStart(2, '0');
    var m = String(d.getMinutes()).padStart(2, '0');
    return h + ':' + m;
  }

  function appendDivider() {
    chat.appendChild(el('div', 'divider', clock()));
  }

  function appendRow(msg) {
    var row = el('div', 'row' + (msg.who === 'me' ? ' me' : ''));
    var avatar = el('div', 'avatar');
    var bubble = el('div', 'bubble', msg.text);
    if (msg.who === 'me') {
      row.appendChild(bubble);
      row.appendChild(avatar);
    } else {
      row.appendChild(avatar);
      row.appendChild(bubble);
    }
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function appendTyping() {
    var row = el('div', 'row');
    row.appendChild(el('div', 'avatar'));
    var b = el('div', 'bubble');
    b.innerHTML = '<span class="typing">对方正在输入<em class="dots">' +
      '<span>.</span><span>.</span><span>.</span></em></span>';
    b.style.boxShadow = '0 1px 2px rgba(16,24,40,0.06)';
    row.appendChild(b);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  async function play() {
    chat.innerHTML = '';
    appendDivider();
    await sleep(400);
    for (var i = 0; i < SCRIPT.length; i++) {
      var msg = SCRIPT[i];
      if (msg.who === 'them') {
        var typing = appendTyping();
        await sleep(1150);
        typing.remove();
      } else {
        await sleep(620);
      }
      appendRow(msg);
      await sleep(780);
    }
    await sleep(2400);
    play();          // 整体循环播放
  }

  play();
</script>
</body>
</html>
