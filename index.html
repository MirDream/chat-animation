<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>聊天动画 · v1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    background: #d9dde3;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .phone {
    width: 375px;
    height: 720px;
    background: #ededed;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
    display: flex;
    flex-direction: column;
  }
  .bar {
    height: 48px;
    background: #ededed;
    border-bottom: 1px solid #dcdcdc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    color: #191919;
  }
  .chat {
    flex: 1;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
  }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .row.me { justify-content: flex-end; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 6px;
    flex: 0 0 34px;
    background: #c8ccd4;
  }
  .row.me .avatar { background: #a8c7a0; }
  .bubble {
    max-width: 230px;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    color: #191919;
    background: #ffffff;
    word-break: break-word;
  }
  .row.me .bubble { background: #95ec69; }
</style>
</head>
<body>
  <div class="phone">
    <div class="bar">码道小助手</div>
    <div class="chat">
      <div class="row">
        <div class="avatar"></div>
        <div class="bubble">在吗？</div>
      </div>
      <div class="row me">
        <div class="bubble">在的，怎么啦？</div>
        <div class="avatar"></div>
      </div>
    </div>
  </div>
</body>
</html>
